<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vagaz</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22><path fill=%22%2334d399%22 d=%22M256 0c141.4 0 256 114.6 256 256c0 141.4-114.6 256-256 256C114.6 512 0 397.4 0 256C0 114.6 114.6 0 256 0zM128 320a128 128 0 1 0 256 0 128 128 0 1 0 -256 0zM224 256a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z%22/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/login.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: '#0d9488',
                        brandHover: '#0f766e',
                        softBg: '#f0fdfa',
                        darkBg: '#0f172a',
                        darkCard: '#1e293b'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="light-theme min-h-screen flex flex-col items-center justify-center p-4 relative text-gray-800 dark:text-gray-200">
    <button onclick="toggleTheme()" class="absolute top-8 right-8 text-slate-400 hover:text-brand transition-colors text-2xl p-2 outline-none">
        <i id="theme-icon" class="fa-solid fa-moon"></i>
    </button>
    <div id="toast" class="absolute top-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-xl shadow-lg text-white font-medium opacity-0 pointer-events-none transform -translate-y-4 z-50">
        <span id="toast-message">Mensagem aqui</span>
    </div>
    <div class="max-w-sm w-full bg-white dark:bg-darkCard rounded-[2rem] shadow-xl overflow-hidden p-10 relative transition-colors duration-300">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-brand to-teal-600 mb-5 shadow-lg shadow-brand/30 transform transition-transform hover:scale-105">
                <i class="fa-solid fa-satellite-dish text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-brand to-teal-500 tracking-tighter">Vagaz</h1>
            <p class="text-gray-500 dark:text-gray-400 mt-1 text-sm font-medium">O seu radar de oportunidades.</p>
        </div>
        <div class="bg-slate-100 dark:bg-slate-800 p-1 rounded-xl flex mb-10 relative">
            <div id="slider-bg" class="absolute w-1/2 h-[85%] bg-white dark:bg-slate-700 shadow-sm rounded-lg top-1/2 -translate-y-1/2 left-1 transition-all duration-300 ease-in-out">
            </div>
            <button onclick="switchTab('login')" id="btn-login" class="flex-1 py-2.5 text-sm font-semibold z-10 text-brand dark:text-teal-400 transition-colors">Entrar</button>
            <button onclick="switchTab('register')" id="btn-register" class="flex-1 py-2.5 text-sm font-semibold z-10 text-gray-500 dark:text-gray-400 transition-colors">Cadastrar</button>
        </div>
        <div class="overflow-hidden">
            <div id="form-slider" class="form-slider translate-x-0">
                <div class="form-panel">
                    <form id="form-login" class="space-y-5">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5 ml-1 uppercase tracking-wider">E-mail</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fa-regular fa-envelope text-gray-400 text-sm"></i>
                                </div>
                                <input type="email" id="login-email"
                                    class="w-full pl-11 pr-4 py-3.5 rounded-xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-brand/20 focus:border-brand transition-all outline-none text-sm text-gray-700 dark:text-gray-200"
                                    placeholder="seu@email.com" required>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5 ml-1 uppercase tracking-wider">Senha</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-lock text-gray-400 text-sm"></i>
                                </div>
                                <input type="password" id="login-senha"
                                    class="w-full pl-11 pr-4 py-3.5 rounded-xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-brand/20 focus:border-brand transition-all outline-none text-sm text-gray-700 dark:text-gray-200"
                                    placeholder="••••••••" required>
                            </div>
                        </div>
                        <button type="submit" id="btn-submit-login"
                            class="w-full bg-brand hover:bg-brandHover text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-brand/30 active:scale-[0.98] mt-6 flex justify-center items-center">
                            Acessar Vagaz
                        </button>
                    </form>
                </div>
                <div class="form-panel">
                    <form id="form-register" class="space-y-5">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5 ml-1 uppercase tracking-wider">Como quer ser chamado?</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fa-regular fa-user text-gray-400 text-sm"></i>
                                </div>
                                <input type="text" id="reg-nome"
                                    class="w-full pl-11 pr-4 py-3.5 rounded-xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-brand/20 focus:border-brand transition-all outline-none text-sm text-gray-700 dark:text-gray-200"
                                    placeholder="Seu nome" required>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5 ml-1 uppercase tracking-wider">E-mail</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fa-regular fa-envelope text-gray-400 text-sm"></i>
                                </div>
                                <input type="email" id="reg-email"
                                    class="w-full pl-11 pr-4 py-3.5 rounded-xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-brand/20 focus:border-brand transition-all outline-none text-sm text-gray-700 dark:text-gray-200"
                                    placeholder="seu@email.com" required>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5 ml-1 uppercase tracking-wider">Crie uma senha</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-lock text-gray-400 text-sm"></i>
                                </div>
                                <input type="password" id="reg-senha" minlength="6"
                                    class="w-full pl-11 pr-4 py-3.5 rounded-xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-brand/20 focus:border-brand transition-all outline-none text-sm text-gray-700 dark:text-gray-200"
                                    placeholder="Mínimo 6 caracteres" required>
                            </div>
                        </div>
                        <button type="submit" id="btn-submit-reg"
                            class="w-full bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 dark:hover:bg-slate-600 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg active:scale-[0.98] mt-6 flex justify-center items-center">
                            Criar conta
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/js/login.js" defer></script>
</body>
</html>
